plugins {
	id 'com.android.application'
}

// 从项目根目录的 keystore.properties 读取签名配置（请勿提交到版本库）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
	keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
	compileSdk 34
	
	useLibrary 'org.apache.http.legacy'
	
	defaultConfig {
		applicationId "com.flappybird.recreation"
		namespace "com.flappybird.recreation"
		minSdkVersion 21
		targetSdkVersion 35
		versionCode 15
		versionName "1.5 beta2"
	}
	
	signingConfigs {
		release {
			if (keystorePropertiesFile.exists()) {
				storeFile rootProject.file(keystoreProperties['storeFile'])
				storePassword keystoreProperties['storePassword']
				keyAlias keystoreProperties['keyAlias']
				keyPassword keystoreProperties['keyPassword']
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			if (keystorePropertiesFile.exists()) {
				signingConfig signingConfigs.release
			}
		}
	}
	buildFeatures {
		// 关闭 ViewBinding：代码未使用，且 settings.xml 视图过多，
		// 生成的 SettingsBinding 构造器会超出 JVM 255 参数上限
		viewBinding false
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.appcompat:appcompat:1.7.0'
	implementation 'com.google.android.material:material:1.12.0'
}
